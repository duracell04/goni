id: SRC-JANG2022-NEGATED-PROMPTS
title: "Can Large Language Models Truly Understand Prompts? A Case Study with Negated Prompts"
kind: academic
citation: "Jang, J., Ye, S., & Seo, M. (2022). Can Large Language Models Truly Understand Prompts? A Case Study with Negated Prompts. arXiv:2209.12711."
url: https://arxiv.org/abs/2209.12711
accessed: "2026-09-23"
notes: Reports large performance degradation on negated prompts across the evaluated model families, including inverse-scaling behavior. This motivates minimizing unnecessary dependence on negation while preserving explicit prohibitions where the forbidden state itself is a material boundary.
