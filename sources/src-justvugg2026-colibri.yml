notes: Colibrì presents an MoE inference runtime that treats VRAM, RAM, and storage as a managed hierarchy, using routing heat, hot-store placement, caching, and prefetching while aiming to preserve model semantics across residency tiers. It is engineering evidence for placement and staging patterns, not academic proof of GONI semantic-memory or authority claims.
