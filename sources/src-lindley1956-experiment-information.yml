title: Lindley 1956 - On a Measure of the Information Provided by an Experiment
kind: academic
citation: "Lindley, D. V. (1956). On a Measure of the Information Provided by an Experiment. The Annals of Mathematical Statistics, 27(4), 986-1005. https://doi.org/10.1214/aoms/1177728069"
