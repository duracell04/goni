notes: Google describes LiteRT-LM session save/restore, serialization of large KV-cache state, memory-local execution, dynamic loading of multimodal encoders, and constrained decoding for on-device inference. This is vendor engineering evidence for state continuity and memory-locality mechanisms; it does not establish GONI governance, provenance, or authority semantics.
