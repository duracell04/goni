id: SRC-DONG2024-XGRAMMAR
title: "XGrammar: Flexible and Efficient Structured Generation Engine for Large Language Models"
kind: academic
citation: "Dong, Y., Ruan, C. F., Cai, Y., Lai, R., Xu, Z., Zhao, Y., & Chen, T. (2024). XGrammar: Flexible and Efficient Structured Generation Engine for Large Language Models. arXiv:2411.15100."
url: https://arxiv.org/abs/2411.15100
accessed: "2026-09-23"
notes: XGrammar presents grammar-constrained structured generation and reports low-overhead integration with LLM inference engines. It supports treating structural validity as an inference-engine concern distinct from semantic correctness.
