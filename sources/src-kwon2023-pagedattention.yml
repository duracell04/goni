notes: Kwon et al. introduce PagedAttention and vLLM, applying operating-system virtual-memory and paging ideas to dynamic KV-cache management. The source supports the systems analogy that logical availability can be decoupled from physical residency; it does not itself establish semantic memory, provenance, or authority semantics for GONI.
