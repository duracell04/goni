name: Operational Sovereignty One-Time Catalogue Projection

on:
  push:
    branches:
      - agent/operational-sovereignty-20261109

permissions:
  contents: write

jobs:
  project-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operational-sovereignty-20261109
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic catalogue and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tooling/requirements.txt
          python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
          rm .github/workflows/opsov-projection-once.yml
          git add -A -- maps/catalogue.json .github/workflows/opsov-projection-once.yml
          git config user.name "goni-catalogue-builder"
          git config user.email "goni-catalogue-builder@users.noreply.github.com"
          cat > /tmp/opsov-commit-message <<'MSG'
          kg(security): materialize deterministic sovereignty catalogue

          Intent:
          Commit the canonical graph projection for the new sovereignty nodes and remove the temporary one-time projector.

          Rationale:
          Keep the generated map aligned with authored knowledge and existing strict validation without changing permanent tooling.

          Status:
          specified-only

          Contracts:
          - maps/catalogue.json; tooling/build_catalogue.py; COMMIT_STANDARD.md

          Files:
          - .github/workflows/opsov-projection-once.yml
          - maps/catalogue.json

          Evidence:
          - Deterministic projection from canonical knowledge nodes using the repository's existing generator

          Unresolved:
          - Adversarial runtime assurance tests remain future research
          MSG
          git commit -F /tmp/opsov-commit-message
          git push origin HEAD:agent/operational-sovereignty-20261109
