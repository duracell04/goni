name: Temporary inference catalogue refresh

on:
  push:
    branches:
      - agent/inference-memory-hierarchy-20261021

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Build and validate projection
        run: |
          python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
          python tooling/validate.py --strict --skip-commits --baseline pre-knowledge-graph-2026-08-03
      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -F - <<'MESSAGE'
          kg(inference-catalogue): rebuild deterministic projection

          Intent:
          Publish the deterministic projection for inference placement and evaluation nodes.

          Rationale:
          Keep the canonical knowledge graph aligned with its source nodes.

          Status:
          specified-only

          Contracts:
          - INF-PLACE-01
          - EXP-INF-PLACE-01

          Files:
          - maps/catalogue.json

          Evidence:
          - Python catalogue generator and strict node validation

          Unresolved:
          - Physical runtime benchmarks
          MESSAGE
          git push origin "HEAD:${GITHUB_REF_NAME}"
