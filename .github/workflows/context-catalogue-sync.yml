name: Context Catalogue Sync
# Temporary branch-scoped projection helper; remove after catalogue commit.

on:
  push:
    branches:
      - "kg/context-compilation-stack"

permissions:
  contents: write

jobs:
  sync-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Rebuild catalogue
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit catalogue projection when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- maps/catalogue.json; then
            echo "Catalogue already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/catalogue.json
          cat > /tmp/catalogue-commit-message.txt <<'EOF'
          kg(catalogue): project context compilation stack

          Intent:
          Regenerate the deterministic catalogue projection for the context compilation stack.

          Rationale:
          The canonical knowledge and source nodes changed; maps/catalogue.json must match tooling/build_catalogue.py exactly.

          Status:
          implemented-tested

          Contracts:
          - tooling/build_catalogue.py
          - maps/catalogue.json

          Files:
          - maps/catalogue.json

          Evidence:
          - Generated by tooling/build_catalogue.py from the checked-out branch state

          Unresolved:
          - none
          EOF
          sed -i 's/^          //' /tmp/catalogue-commit-message.txt
          git commit -F /tmp/catalogue-commit-message.txt
          git push origin HEAD:"$GITHUB_REF_NAME"
