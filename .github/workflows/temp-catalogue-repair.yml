name: Temporary Catalogue Repair

on:
  push:
    branches:
      - agent/ai-systems-engineering-2026-09-20

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Regenerate catalogue
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit generated projection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- maps/catalogue.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/commit-message.txt <<EOF
          kg(projection): regenerate AI systems catalogue

          Intent:
          Regenerate the deterministic canonical catalogue after adding and repairing the AI-systems knowledge nodes.

          Rationale:
          The catalogue is a machine-generated projection of canonical knowledge and must match the repository tree before strict validation can pass.

          Status:
          specified-only

          Contracts:
          - maps/catalogue.json

          Files:
          - maps/catalogue.json

          Evidence:
          - python tooling/build_catalogue.py --edition-sha $GITHUB_SHA

          Unresolved:
          - none
          EOF
          sed -i 's/^          //' /tmp/commit-message.txt
          git add maps/catalogue.json
          git commit -F /tmp/commit-message.txt
          git push
