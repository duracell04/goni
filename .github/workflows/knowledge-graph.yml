name: Knowledge Graph

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

jobs:
  strict-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Build pinned projection
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- maps/catalogue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add maps/catalogue.json
            git commit -m "$(cat <<'EOF'
          kg(catalogue): refresh deterministic projection

          Intent:
          Commit the deterministic catalogue generated from the virtual cognitive memory knowledge branch.

          Rationale:
          Canonical knowledge and source additions change the machine projection; the generated catalogue must match the repository builder exactly.

          Status:
          implemented-and-tested

          Contracts:
          - deterministic catalogue

          Files:
          - maps/catalogue.json

          Evidence:
          - python tooling/build_catalogue.py --edition-sha $GITHUB_SHA

          Unresolved:
          - none
          EOF
          )"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run strict validation
        env:
          VALIDATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tooling/validate.py --strict --baseline pre-knowledge-graph-2026-08-03 --head "$VALIDATION_HEAD"
      - name: Verify deterministic projection is committed
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum maps/catalogue.json)
          python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
          after=$(sha256sum maps/catalogue.json)
          test "$before" = "$after"
          git diff --exit-code -- maps/catalogue.json
