name: Knowledge Graph

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

jobs:
  strict-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Build pinned projection
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Materialize scratch projection
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/minimum-sufficient-control'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- maps/catalogue.json; then
            git config user.name "goni-projection-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add maps/catalogue.json
            git commit -m $'kg(projection): materialize scratch catalogue\n\nIntent:\nMaterialize the deterministic catalogue required to validate the scratch knowledge-graph workstream.\n\nRationale:\nThe scratch branch is used only to obtain the exact repository-generated projection before the final topic history is rebuilt from main; the canonical workflow is restored in the final tree.\n\nStatus:\nimplemented-and-tested\n\nContracts:\n- maps/catalogue.json\n\nFiles:\n- maps/catalogue.json\n\nEvidence:\n- python tooling/build_catalogue.py --edition-sha $GITHUB_SHA\n\nUnresolved:\n- none'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run strict validation
        env:
          VALIDATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tooling/validate.py --strict --baseline pre-knowledge-graph-2026-08-03 --head "$VALIDATION_HEAD"
      - name: Verify deterministic projection is committed
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum maps/catalogue.json)
          python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
          after=$(sha256sum maps/catalogue.json)
          test "$before" = "$after"
          git diff --exit-code -- maps/catalogue.json
