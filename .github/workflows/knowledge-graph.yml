name: Knowledge Graph

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

jobs:
  strict-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Build pinned projection
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit generated catalogue on topic branch
        if: github.event_name == 'push' && github.ref_name == 'agent/agent-systems-academic-update'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- maps/catalogue.json; then
            exit 0
          fi
          git config user.name "goni-knowledge-graph"
          git config user.email "actions@users.noreply.github.com"
          git add maps/catalogue.json
          git commit -F - <<'EOF'
          kg(catalogue): refresh agent-systems projection

          Intent:
          Commit the deterministic public catalogue generated from the canonical agent-systems knowledge and source records.

          Rationale:
          Canonical knowledge changes require maps/catalogue.json to remain byte-identical to tooling/build_catalogue.py output. The workflow-generated projection is the authoritative deterministic artifact for this branch.

          Status:
          implemented-untested

          Contracts:
          - tooling/build_catalogue.py
          - maps/catalogue.json

          Files:
          - maps/catalogue.json

          Evidence:
          - catalogue generated by tooling/build_catalogue.py in this workflow run

          Unresolved:
          - strict validation will run on the resulting commit
          EOF
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Upload generated catalogue for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-catalogue
          path: maps/catalogue.json
          if-no-files-found: error
      - name: Run strict validation
        env:
          VALIDATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tooling/validate.py --strict --baseline pre-knowledge-graph-2026-08-03 --head "$VALIDATION_HEAD"
      - name: Verify deterministic projection is committed
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum maps/catalogue.json)
          python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
          after=$(sha256sum maps/catalogue.json)
          test "$before" = "$after"
          git diff --exit-code -- maps/catalogue.json
