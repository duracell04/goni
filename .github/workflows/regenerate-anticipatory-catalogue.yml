name: Regenerate Catalogue Once

on:
  push:
    branches:
      - codex/anticipatory-delegation

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - run: python -m pip install -r tooling/requirements.txt
      - name: Build catalogue
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit deterministic catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -F - <<'MSG'
          kg(catalogue): regenerate anticipatory delegation projection

          Intent:
          Commit the deterministic catalogue projection for the anticipatory delegation knowledge changes.

          Rationale:
          Canonical knowledge and source changes require the generated catalogue to remain synchronized with the repository builder.

          Status:
          implemented-and-tested

          Contracts:
          - tooling/build_catalogue.py
          - maps/catalogue.json

          Files:
          - maps/catalogue.json

          Evidence:
          - generated by tooling/build_catalogue.py on GitHub Actions

          Unresolved:
          - none
          MSG
          git push origin HEAD:codex/anticipatory-delegation
