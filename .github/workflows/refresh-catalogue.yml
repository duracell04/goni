name: Refresh Catalogue

on:
  push:
    branches:
      - "agent/verified-compute-substrate"

permissions:
  contents: write

jobs:
  refresh-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Rebuild catalogue
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit changed projection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- maps/catalogue.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/catalogue.json
          git commit -F - <<'MSG'
          kg(repo): refresh deterministic knowledge projection

          Intent:
          maps/catalogue.json matches the canonical verified-compute knowledge and source nodes on this branch.

          Rationale:
          The repository requires the deterministic machine projection to be committed and byte-stable under tooling/build_catalogue.py.

          Status:
          specified-only

          Contracts:
          - none

          Files:
          - maps/catalogue.json
          Evidence:
          - tooling/build_catalogue.py

          Unresolved:
          - none
          MSG
          git push origin HEAD:"$GITHUB_REF_NAME"
