name: Temporary Catalogue Sync

on:
  push:
    branches:
      - feature/nonuniform-cognitive-resource-allocation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nonuniform-cognitive-resource-allocation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install deterministic tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Regenerate catalogue
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Commit catalogue projection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- maps/catalogue.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/catalogue.json
          git commit -F - <<'MSG'
          kg(catalogue): project cognitive allocation nodes

          Intent:
          Regenerate the deterministic catalogue for the cognitive allocation architecture slice.

          Rationale:
          The canonical knowledge graph requires its committed machine projection to match authored nodes, relations, aliases, indexes, and sources.

          Status:
          specified-only

          Contracts:
          - tooling/build_catalogue.py
          - maps/catalogue.json

          Files:
          - maps/catalogue.json

          Evidence:
          - generated by tooling/build_catalogue.py on the feature branch

          Unresolved:
          - none
          MSG
          git push origin HEAD:feature/nonuniform-cognitive-resource-allocation
