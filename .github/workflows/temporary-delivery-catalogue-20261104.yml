name: Temporary delivery catalogue regeneration
on:
  push:
    branches:
      - agent/blueprint-ci-assurance-20261104
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Build and validate catalogue
        shell: bash
        run: |
          set -euo pipefail
          python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
          python tooling/validate.py --strict --skip-commits --baseline pre-knowledge-graph-2026-08-03
      - name: Commit catalogue and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-delivery-catalogue-20261104.yml
          git add maps/catalogue.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F - <<'MESSAGE'
          kg(projection): publish delivery assurance catalogue

          Intent:
          Publish the deterministic catalogue for delivery assurance nodes and remove temporary generation scaffolding.

          Rationale:
          Generate the large catalogue from the canonical builder without modifying permanent CI tooling.

          Status:
          specified-only

          Contracts:
          - DELIVERY-MIN-01
          - OPS-CONTRACT-01
          - CI-ASSURANCE-01
          - EVAL-DELIVERY-01

          Files:
          - .github/workflows/temporary-delivery-catalogue-20261104.yml
          - maps/catalogue.json

          Evidence:
          - Deterministic canonical catalogue generated by tooling/build_catalogue.py with strict structural validation.

          Unresolved:
          - No runtime implementation or recovery guarantees are asserted.
          MESSAGE
          python tooling/validate.py --strict --baseline pre-knowledge-graph-2026-08-03 --head HEAD
          git push origin HEAD:"$GITHUB_REF_NAME"
