name: One-shot tool-failure catalogue sync

on:
  push:
    branches:
      - agent/tool-failure-boundary-attribution-20261124
    paths:
      - .github/workflows/one-shot-tool-failure-catalogue-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r tooling/requirements.txt
      - name: Regenerate deterministic catalogue
        run: python tooling/build_catalogue.py --edition-sha "$GITHUB_SHA"
      - name: Validate generated graph and schemas
        run: python tooling/validate.py --strict --baseline pre-knowledge-graph-2026-08-03 --skip-commits
      - name: Commit catalogue to topic branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- maps/catalogue.json
          git diff --cached --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F - <<'MSG'
          kg(catalogue): Synchronize tool-failure diagnostic projection

          Intent:
          Update the generated machine catalogue for tool-failure diagnosis, the redacted incident, and the proposed evaluation.

          Rationale:
          Keep the canonical knowledge projection deterministic and match the validated node/source graph.

          Status:
          specified-only

          Contracts:
          - SPEC-TOOLFAIL-01
          - EXP-TOOLFAIL-01
          - EVID-TOOL-FAILURE-20261124

          Files:
          - maps/catalogue.json

          Evidence:
          - tooling/build_catalogue.py generated the projection.
          - tooling/validate.py --strict --skip-commits passed before committing.

          Unresolved:
          - Remove the temporary synchronization workflow after this commit.
          MSG
          python tooling/validate.py --strict --baseline pre-knowledge-graph-2026-08-03
          git push origin HEAD:agent/tool-failure-boundary-attribution-20261124
